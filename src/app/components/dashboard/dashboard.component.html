<div class="dashboard-container">
  <div class="dashboard-header">
    <h2>Latest CyberSec News</h2>

    <label class="count-selector">
      <span class="count-label">Show</span>
      <select
        class="count-select"
        [value]="count"
        (change)="onCountChange($any($event.target).value)"
        aria-label="Number of news items to fetch"
      >
        <option *ngFor="let option of countOptions" [value]="option">{{ option }}</option>
      </select>
    </label>
  </div>

  <div *ngIf="isLoading && newsList.length === 0" class="loading-state" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading news...</p>
  </div>

  <div *ngIf="errorMessage" class="error-state" role="alert">
    <p class="error-message">{{ errorMessage }}</p>
  </div>

  <div *ngIf="isStale && !errorMessage" class="stale-state" role="status">
    <p>The news feeds are unreachable right now, so this is the last batch we were able to load.</p>
  </div>

  <div *ngIf="!isLoading && newsList.length === 0 && !errorMessage" class="empty-state">
    <p>No news available at the moment.</p>
  </div>

  <div *ngIf="newsList.length > 0" class="news-grid">
    <app-news-card
      *ngFor="let item of pagedNews; trackBy: trackByStarKey"
      [item]="item"
      [starred]="isStarred(item)"
    ></app-news-card>
  </div>

  <app-paginator
    [total]="newsList.length"
    [pageSize]="pageSize"
    [page]="page"
    [showCount]="!isStale"
    label="articles"
    (pageChange)="onPageChange($event)"
  ></app-paginator>
</div>
