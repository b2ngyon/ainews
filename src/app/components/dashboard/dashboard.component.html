<div class="dashboard-container">
  <h2>Latest CyberSec News</h2>

  <div *ngIf="isLoading && newsList.length === 0" class="loading-state" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading news...</p>
  </div>

  <div *ngIf="errorMessage" class="error-state" role="alert">
    <p class="error-message">{{ errorMessage }}</p>
  </div>

  <div *ngIf="!isLoading && newsList.length === 0 && !errorMessage" class="empty-state">
    <p>No news available at the moment.</p>
  </div>

  <div *ngIf="newsList.length > 0" class="news-grid">
    <app-news-card
      *ngFor="let item of newsList; trackBy: trackByStarKey"
      [item]="item"
      [starred]="isStarred(item)"
    ></app-news-card>
  </div>
</div>
