<nav *ngIf="total > 0" class="paginator" [attr.aria-label]="'Pagination for ' + label">
  <p class="paginator-status" role="status" aria-live="polite">
    <ng-container *ngIf="showCount; else rangeOnly">
      Showing {{ firstShown }}&ndash;{{ lastShown }} of {{ total }} {{ label }}
    </ng-container>
    <ng-template #rangeOnly>
      Showing {{ firstShown }}&ndash;{{ lastShown }} {{ label }}
    </ng-template>
  </p>

  <div *ngIf="totalPages > 1" class="paginator-controls">
    <button
      type="button"
      class="paginator-button"
      [disabled]="!hasPrevious"
      (click)="goTo(page - 1)"
      aria-label="Previous page"
    >
      Previous
    </button>

    <span class="paginator-page">Page {{ page }} of {{ totalPages }}</span>

    <button
      type="button"
      class="paginator-button"
      [disabled]="!hasNext"
      (click)="goTo(page + 1)"
      aria-label="Next page"
    >
      Next
    </button>
  </div>
</nav>
